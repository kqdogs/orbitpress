name: Feature request / 功能建议
description: Describe a real use case / 描述实际需求
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case / 问题与使用场景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior and alternatives / 期望行为与替代方案
    validations:
      required: true
